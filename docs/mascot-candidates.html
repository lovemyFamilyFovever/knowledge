<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出错页插画候选 · 知库</title>
<style>
:root{
  --bg:#f6f4ee; --panel:#fffdf8; --edge:#e4dfd2; --fg:#33312b; --muted:#8a8677;
  --acc:#0c9a6a; --warn:#d97706; --rose:#e05a7a; --halo1:#cde9dc; --halo2:#f3e8c8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:
  radial-gradient(900px 500px at 15% -10%, var(--halo1), transparent 60%),
  radial-gradient(800px 460px at 110% 15%, var(--halo2), transparent 55%),
  var(--bg);
  color:var(--fg);padding:40px 24px 60px}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:26px;letter-spacing:.02em;margin-bottom:6px}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:22px 18px 18px;text-align:center;
  box-shadow:0 10px 30px rgba(60,50,30,.06)}
.card svg{width:200px;height:150px;display:block;margin:0 auto}
.card h2{font-size:15px;margin:14px 0 4px}
.card p{font-size:12.5px;color:var(--muted);line-height:1.6}
.tag{display:inline-block;margin-top:10px;font-size:11px;padding:3px 10px;border-radius:99px;
  border:1px solid var(--edge);color:var(--muted)}
.e-title{font-size:17px;font-weight:700;margin-top:16px}
.e-desc{font-size:12.5px;color:var(--muted);margin-top:4px}
.mbtn{display:inline-block;margin-top:14px;font-size:12.5px;padding:8px 16px;border-radius:9px;background:var(--acc);color:#fff;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>出错页插画候选（候选一 · 无辜呆坐）</h1>
  <div class="sub">同一套形象语言（豆豆眼 / 腮红 / 气泡），三款情绪。选好后告诉我编号，我把 404/500 页换成对应款。</div>
  <div class="grid">

  <!-- 候选一：无辜呆坐（现状的修正版：去掉下垂嘴与呆毛，圆眼+浅笑，情绪是"不是我干的"） -->
  <div class="card">
    <svg viewBox="0 0 200 150" aria-hidden="true">
      <ellipse cx="100" cy="88" rx="88" ry="50" fill="#cde9dc" opacity=".45"/>
      <ellipse cx="100" cy="133" rx="50" ry="5" fill="#d8d2c2"/>
      <ellipse cx="100" cy="58" rx="26" ry="28" fill="#fdfaf2" stroke="#33312b" stroke-width="2"/>
      <path d="M78 50 Q80 32 100 32 Q120 32 122 50 Q112 40 100 40 Q88 40 78 50 Z" fill="#33312b"/>
      <circle cx="91" cy="58" r="3" fill="#33312b"/>
      <circle cx="109" cy="58" r="3" fill="#33312b"/>
      <circle cx="92.5" cy="57" r="1" fill="#fff"/><circle cx="110.5" cy="57" r="1" fill="#fff"/>
      <path d="M95 68 Q100 71 105 68" stroke="#33312b" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="83" cy="64" rx="5" ry="2.4" fill="#f4b8a0" opacity=".8"/>
      <ellipse cx="117" cy="64" rx="5" ry="2.4" fill="#f4b8a0" opacity=".8"/>
      <path d="M76 96 Q100 84 124 96 L119 126 Q100 133 81 126 Z" fill="#fdfaf2" stroke="#33312b" stroke-width="2"/>
      <path d="M88 88 Q100 94 112 88 L110 98 Q100 103 90 98 Z" fill="#0c9a6a" opacity=".85"/>
      <path d="M76 98 Q60 92 56 78" stroke="#33312b" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M124 98 Q140 92 144 78" stroke="#33312b" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M132 18 h34 a6 6 0 0 1 6 6 v20 a6 6 0 0 1 -6 6 h-22 l-9 8 v-8 h-3 a6 6 0 0 1 -6 -6 V24 a6 6 0 0 1 6 -6 Z" fill="#fff" stroke="#33312b" stroke-width="2"/>
      <text x="149" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">?</text>
    </svg>
    <div class="e-title">出错了</div>
    <div class="e-desc">这个页面打不开了。</div>
    <a class="mbtn" href="javascript:void(0)">返回首页</a>
    <div><span class="tag">候选一 · 无辜呆坐：圆眼浅笑，情绪是「页面不在了，我也不想」</span></div>
  </div>

  <!-- 候选二：小乌云（雨云遮脸偷看，情绪柔和，和绿色主题最搭） -->
  <div class="card">
    <svg viewBox="0 0 200 150" aria-hidden="true">
      <ellipse cx="100" cy="92" rx="88" ry="48" fill="#cfe3f5" opacity=".5"/>
      <ellipse cx="100" cy="135" rx="46" ry="4.5" fill="#d8d2c2"/>
      <path d="M56 66 Q52 42 76 40 Q82 22 104 26 Q124 20 132 40 Q152 42 148 62 Q160 74 142 82 L64 82 Q48 78 56 66 Z"
            fill="#e8eef7" stroke="#33312b" stroke-width="2"/>
      <circle cx="90" cy="60" r="3" fill="#33312b"/>
      <circle cx="114" cy="60" r="3" fill="#33312b"/>
      <path d="M96 70 Q102 73 108 70" stroke="#33312b" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="84" cy="66" rx="4.5" ry="2.2" fill="#f4b8a0" opacity=".75"/>
      <ellipse cx="120" cy="66" rx="4.5" ry="2.2" fill="#f4b8a0" opacity=".75"/>
      <g stroke="#7fb3e0" stroke-width="2.4" stroke-linecap="round">
        <line x1="72" y1="94" x2="68" y2="104"/><line x1="100" y1="96" x2="100" y2="108"/><line x1="128" y1="94" x2="132" y2="104"/>
      </g>
      <g stroke="#7fb3e0" stroke-width="2" stroke-linecap="round" opacity=".6">
        <line x1="84" y1="104" x2="81" y2="112"/><line x1="116" y1="104" x2="119" y2="112"/>
      </g>
      <ellipse cx="146" cy="118" rx="18" ry="9" fill="#0c9a6a" opacity=".9"/>
      <path d="M160 116 l12 0 m0 0 -4 -3 m4 3 -4 3" stroke="#0c9a6a" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="e-title">出错了</div>
    <div class="e-desc">这页淋湿了，暂时打不开。</div>
    <a class="mbtn" href="javascript:void(0)">返回首页</a>
    <div><span class="tag">候选二 · 小乌云：下着小雨的云，情绪是「偶遇小事故」</span></div>
  </div>

  <!-- 候选三：低电量小机器人（圆头机器人趴着，情绪是"没电了"） -->
  <div class="card">
    <svg viewBox="0 0 200 150" aria-hidden="true">
      <ellipse cx="100" cy="90" rx="88" ry="48" fill="#efe3f3" opacity=".5"/>
      <ellipse cx="100" cy="134" rx="52" ry="5" fill="#d8d2c2"/>
      <line x1="100" y1="26" x2="100" y2="38" stroke="#33312b" stroke-width="2"/>
      <circle cx="100" cy="23" r="4" fill="#e05a7a"/>
      <rect x="66" y="38" width="68" height="52" rx="16" fill="#fdfaf2" stroke="#33312b" stroke-width="2"/>
      <g fill="#33312b">
        <circle cx="88" cy="60" r="3"/><circle cx="112" cy="60" r="3"/>
      </g>
      <path d="M93 52 l-8 -3 M107 52 l8 -3" stroke="#33312b" stroke-width="2" stroke-linecap="round"/>
      <path d="M96 70 Q100 67 104 70" stroke="#33312b" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <rect x="80" y="100" width="40" height="16" rx="5" fill="#fdfaf2" stroke="#33312b" stroke-width="2" transform="rotate(-8 100 108)"/>
      <rect x="84" y="103.5" width="18" height="9" rx="2.5" fill="#e05a7a" transform="rotate(-8 100 108)"/>
      <path d="M74 92 Q64 104 58 112 M126 92 Q134 104 140 110" stroke="#33312b" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M148 44 h26 a5 5 0 0 1 5 5 v16 a5 5 0 0 1 -5 5 h-14 l-7 6 v-6 h-5 a5 5 0 0 1 -5 -5 V49 a5 5 0 0 1 5 -5 Z" fill="#fff" stroke="#33312b" stroke-width="2"/>
      <text x="161" y="61" text-anchor="middle" font-size="12" font-weight="700" fill="#e05a7a">404</text>
    </svg>
    <div class="e-title">出错了</div>
    <div class="e-desc">电量耗尽，页面没撑住。</div>
    <a class="mbtn" href="javascript:void(0)">返回首页</a>
    <div><span class="tag">候选三 · 低电量机器人：趴杆小机器人，情绪是「累了，歇会」</span></div>
  </div>

  </div>
</div>
</body>
</html>
