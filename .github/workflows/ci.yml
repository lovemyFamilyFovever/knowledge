name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps (reader + RAG)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-rag.txt
      - name: Reader smoke
        run: python tests/test_reader.py
      - name: Scaffolder smoke
        run: python tests/test_new_project.py
      - name: RAG smoke (model not preloaded; download via mirror)
        env:
          HF_ENDPOINT: https://hf-mirror.com
        run: python tests/test_rag.py
