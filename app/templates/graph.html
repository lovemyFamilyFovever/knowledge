{% extends "base.html" %}
{% block title %}知识图谱 · 知库{% endblock %}
{% block body %}
<main class="single">
  <section class="panel page-panel">
    <div class="crumb">
      <b>知识图谱</b><span class="sep">·</span>{{ n_md }} 篇文档 · {{ HUES|length }} 大领域
      <span class="sep">·</span>点击文档节点跳转阅读，滚轮缩放，拖拽整理布局
      <span class="spacer"></span>
      <a class="iconbtn" href="/">← 返回阅读</a>
    </div>
    <div id="graph"></div>
  </section>
</main>
{% endblock %}

{% block scripts %}
<script src="/static/echarts.min.js"></script>
<script>
(function () {
  const el = document.getElementById("graph");
  const chart = echarts.init(el, null, { renderer: "canvas" });

  function palette() {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    return {
      text: dark ? "#93a8a2" : "#5c716c",
      edge: dark ? "rgba(126,255,215,.14)" : "rgba(40,60,50,.14)",
      sat: dark ? "62%" : "52%",
      lig: dark ? "60%" : "40%",
    };
  }

  function render(data) {
    const p = palette();
    data.nodes.forEach(n => {
      n.itemStyle = { color: `hsl(${n.hue}, ${p.sat}, ${p.lig})` };
      if (n.nodeType === "doc") n.label = { show: false };
    });
    chart.setOption({
      backgroundColor: "transparent",
      tooltip: {
        confine: true,
        formatter: prm => prm.dataType === "node"
          ? (prm.data.nodeType === "doc"
            ? `${prm.data.name}<br><span style="opacity:.65">${prm.data.id}</span>`
            : `${prm.data.name} · ${prm.data.n} 篇`)
          : "",
      },
      legend: {
        data: data.categories.map(c => c.name), top: 8, type: "scroll",
        textStyle: { color: p.text }, pageTextStyle: { color: p.text },
        inactiveColor: "rgba(128,128,128,.35)",
      },
      series: [{
        type: "graph", layout: "force", roam: true, draggable: true,
        data: data.nodes, links: data.links, categories: data.categories,
        force: { repulsion: 80, edgeLength: [22, 110], gravity: 0.15, friction: 0.2 },
        label: { show: false, color: p.text, fontSize: 11 },
        emphasis: { focus: "adjacency", label: { show: true, color: p.text, fontSize: 11 } },
        lineStyle: { color: p.edge, width: 1 },
        scaleLimit: { min: 0.3, max: 8 },
      }],
    }, true);
  }

  fetch("/api/graph").then(r => r.json()).then(render);
  window.addEventListener("resize", () => chart.resize());
  window.addEventListener("theme-changed", () => fetch("/api/graph").then(r => r.json()).then(render));
  chart.on("click", prm => {
    if (prm.dataType === "node" && prm.data.path) location.href = prm.data.path;
  });
})();
</script>
{% endblock %}
