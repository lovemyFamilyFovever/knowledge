<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}知库{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css?v={{ av('style.css') }}">
<link rel="stylesheet" href="/static/hljs-github-dark.min.css?v={{ av('hljs-github-dark.min.css') }}">
<script>window.LABELS={{ LABELS|tojson }};window.HUES={{ HUES|tojson }};window.SUB_LABELS={{ SUB_LABELS|tojson }};window.SOURCE_LABELS={{ SOURCE_LABELS|tojson }};</script>
<script src="/static/marked.umd.js" defer></script>
<script src="/static/purify.min.js" defer></script>
<script src="/static/highlight.min.js" defer></script>
<script src="/static/app.js?v={{ av('app.js') }}" defer></script>
</head>

<div class="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grain"></div>

<header>
  <a class="brand" href="/home" title="返回总览">
    <span class="zh">知库</span>
  </a>
  <div class="searchbox" id="searchbox">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="全文检索，或输入标签过滤…" autocomplete="off" value="{{ q|default('') }}">
    <kbd>/</kbd>
  </div>
  <div class="top-right">
    <button class="pill" id="global-stats-btn" onclick="showGlobalStats()" title="全库统计：总量 / 各域分布 / 标签覆盖 / 双链健康"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;display:block"><path d="M3 3v18h18"/><path d="m7 15 4-6 4 3 5-8"/></svg><span>统计</span></button>
    <a class="pill" href="/inbox" title="收件箱：新收录的待整理内容先进这里，阅读后归档进各领域"><span>收件箱</span><span class="n">{{ inbox_n|default(0) }}</span></a>
    <button class="pill ok" onclick="const q=document.getElementById('q'); q.focus(); q.select();" title="全文索引已就绪；点击聚焦搜索框（快捷键 / 支持语义检索，前缀 ?）"><span class="dot"></span><span>全文检索</span><span class="n">{{ n_md|default(fts_n)|default(0) }}</span></button>
    <button class="pill" id="theme-btn" title="切换白天 / 夜间"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;display:block"><use href="#i-sun"/></svg></button>
  </div>
</header>

{% block body %}{% endblock %}

<div class="statusbar">
  <span class="sb-acc">知库 · 本地阅读器</span>
  <span>content/ = 唯一事实源 · 索引只是派生缓存</span>
  <span class="right"><span>localhost:5001</span></span>
</div>
<div id="toast"></div>
{% block scripts %}{% endblock %}
</body>
</html>
