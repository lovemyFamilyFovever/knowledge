{% extends "base.html" %}
{% block title %}出错了 · 知库{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/pages/misc.css?v={{ av('pages/misc.css') }}">{% endblock %}
{% block body %}
<main class="single">
  <section class="panel page-panel">
    <div class="err-wrap">
      <svg class="mascot" viewBox="0 0 200 150" aria-hidden="true">
        <ellipse cx="100" cy="90" rx="88" ry="48" style="fill:color-mix(in oklab,var(--c-acc),transparent 88%)"/>
        <ellipse cx="100" cy="134" rx="52" ry="5"/>
        <line x1="100" y1="26" x2="100" y2="38" stroke-width="2"/>
        <circle cx="100" cy="23" r="4" class="bot-ant"/>
        <rect x="66" y="38" width="68" height="52" rx="16" stroke-width="2"/>
        <g class="bot-face">
          <circle cx="88" cy="60" r="3"/><circle cx="112" cy="60" r="3"/>
          <path d="M93 52 l-8 -3 M107 52 l8 -3"/>
          <path d="M96 70 Q100 67 104 70"/>
        </g>
        <rect x="80" y="100" width="40" height="16" rx="5" stroke-width="2" transform="rotate(-8 100 108)"/>
        <rect x="84" y="103.5" width="18" height="9" rx="2.5" class="bot-batt" transform="rotate(-8 100 108)"/>
        <path d="M74 92 Q64 104 58 112 M126 92 Q134 104 140 110" fill="none" stroke-width="2"/>
        <path class="bubble" d="M148 44 h26 a5 5 0 0 1 5 5 v16 a5 5 0 0 1 -5 5 h-14 l-7 6 v-6 h-5 a5 5 0 0 1 -5 -5 V49 a5 5 0 0 1 5 -5 Z"/>
        <text x="161" y="61" text-anchor="middle" font-size="12" font-weight="700" class="bot-batt">404</text>
      </svg>
      <div class="e-title">出错了</div>
      <div class="e-desc">{{ message }}</div>
      <a class="mbtn primary" href="/"><svg aria-hidden="true"><use href="#i-chev-left"/></svg>返回首页</a>
    </div>
  </section>
</main>
{% endblock %}
